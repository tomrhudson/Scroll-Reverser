name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone BuildScripts
        run: git clone https://github.com/pilotmoon/BuildScripts.git BuildScripts

      - name: Prepare build environment
        run: |
          mkdir -p log

          # Generate Version.xcconfig manually (bypasses scheme pre-actions)
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          BUILD_NUM=$(git rev-list --count HEAD)

          cat > Version.xcconfig << EOF
          BUILDSCRIPTS_VERSION_NUM = ${BUILD_NUM}
          BUILDSCRIPTS_VERSION_STRING = ${VERSION}
          BUILDSCRIPTS_ORIGINAL_VERSION_STRING = ${VERSION}
          BUILDSCRIPTS_RELEASE_CHANNEL = Production
          BUILDSCRIPTS_RELEASE_EDITION = Standalone
          EOF

          echo "Generated Version.xcconfig:"
          cat Version.xcconfig

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          rm $RUNNER_TEMP/certificate.p12

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild build \
            -project ScrollReverser.xcodeproj \
            -target "Scroll Reverser" \
            -configuration Release \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            SYMROOT=$RUNNER_TEMP/build

          # Copy built app to export location
          mkdir -p $RUNNER_TEMP/export
          cp -R "$RUNNER_TEMP/build/Release/Scroll Reverser.app" "$RUNNER_TEMP/export/Scroll Reverser.app"

      - name: Re-sign Sparkle framework with timestamps
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="$RUNNER_TEMP/export/Scroll Reverser.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          IDENTITY="Developer ID Application"

          # Re-sign all Sparkle binaries with secure timestamps and hardened runtime
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$SPARKLE/Versions/B/Updater.app"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$SPARKLE/Versions/B/Autoupdate"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$SPARKLE"

          # Re-sign the main app too (must be last, after framework is signed)
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"

          # Verify
          codesign --verify --deep --strict "$APP"
          echo "Code signing verified successfully"

      - name: Create zip
        run: |
          cd $RUNNER_TEMP/export
          zip -r -y $RUNNER_TEMP/ScrollReverser-${{ steps.version.outputs.version }}.zip "Scroll Reverser.app"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit $RUNNER_TEMP/ScrollReverser-${{ steps.version.outputs.version }}.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600

          # Staple the app
          xcrun stapler staple "$RUNNER_TEMP/export/Scroll Reverser.app"

          # Re-zip with stapled app
          cd $RUNNER_TEMP/export
          zip -r -y $RUNNER_TEMP/ScrollReverser-${{ steps.version.outputs.version }}.zip "Scroll Reverser.app"

      - name: Sign with Sparkle EdDSA key
        id: sparkle_sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ZIP_PATH=$RUNNER_TEMP/ScrollReverser-${{ steps.version.outputs.version }}.zip
          FILE_SIZE=$(stat -f%z "$ZIP_PATH")

          SIGNATURE=$(swift - "$SPARKLE_PRIVATE_KEY" "$ZIP_PATH" << 'SWIFT_EOF'
          import Foundation
          import CryptoKit

          let args = CommandLine.arguments
          let privKeyBase64 = args[1]
          let filePath = args[2]

          let privKeyData = Data(base64Encoded: privKeyBase64)!
          let privateKey = try! Curve25519.Signing.PrivateKey(rawRepresentation: privKeyData)

          let fileData = try! Data(contentsOf: URL(fileURLWithPath: filePath))
          let signature = try! privateKey.signature(for: fileData)
          let sigBase64 = signature.base64EncodedString()

          print(sigBase64, terminator: "")
          SWIFT_EOF
          )

          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            $RUNNER_TEMP/ScrollReverser-${{ steps.version.outputs.version }}.zip \
            --title "Scroll Reverser ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Update appcast.xml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          SIGNATURE="${{ steps.sparkle_sign.outputs.signature }}"
          FILE_SIZE="${{ steps.sparkle_sign.outputs.file_size }}"
          DOWNLOAD_URL="https://github.com/tomrhudson/Scroll-Reverser/releases/download/${TAG}/ScrollReverser-${VERSION}.zip"
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S %z")

          NEW_ITEM="    <item>\n      <title>Version ${VERSION}<\/title>\n      <pubDate>${PUB_DATE}<\/pubDate>\n      <sparkle:version>${VERSION}<\/sparkle:version>\n      <sparkle:shortVersionString>${VERSION}<\/sparkle:shortVersionString>\n      <sparkle:minimumSystemVersion>13.5<\/sparkle:minimumSystemVersion>\n      <enclosure\n        url=\"${DOWNLOAD_URL}\"\n        length=\"${FILE_SIZE}\"\n        type=\"application\/octet-stream\"\n        sparkle:edSignature=\"${SIGNATURE}\"\n      \/>\n    <\/item>"

          # Insert before closing </channel> tag
          sed -i '' "s|  </channel>|${NEW_ITEM}\n  </channel>|" appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast.xml for ${TAG}"
          git push origin HEAD:main

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
